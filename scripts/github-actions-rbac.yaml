# Applicare sul cluster (con kubeconfig admin):
#   kubectl apply -f github-actions-rbac.yaml
#
# Poi generare il secret GitHub:
#   TOKEN=$(kubectl create token github-actions-business-qa -n business-qa --duration=8760h)
#   ./generate-kubeconfig-secret.sh business-qa "$TOKEN" /path/to/admin.conf
---
apiVersion: v1
kind: Namespace
metadata:
  name: business-qa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-business-qa
  namespace: business-qa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deploy
  namespace: business-qa
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deploy
  namespace: business-qa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-deploy
subjects:
  - kind: ServiceAccount
    name: github-actions-business-qa
    namespace: business-qa
---
apiVersion: v1
kind: Namespace
metadata:
  name: business-prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-business-prod
  namespace: business-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deploy
  namespace: business-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deploy
  namespace: business-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-deploy
subjects:
  - kind: ServiceAccount
    name: github-actions-business-prod
    namespace: business-prod
