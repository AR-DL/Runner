name: BusinessCRM_BackEnd - Micros - K8s
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Which env?
        options:
          - qa
          - prod

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/ar-dl
  DOCKER_REPO_NAME: business_api
  DEPLOYMENT_NAME: business-api
  IMAGE_TAG: ${{ github.run_number }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.env }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set branch for env
        id: branch
        run: |
          if [ "${{ github.event.inputs.env }}" = "prod" ]; then
            echo "branch_name=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=qa" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone Management Core
        working-directory: source
        run: |
          cd ..
          git clone git@github.com:AR-DL/business_core.git
          cd business_core
          git checkout "${{ steps.branch.outputs.branch_name }}"

      - name: Clone Management Extension
        working-directory: source
        run: |
          cd ..
          git clone git@github.com:AR-DL/business_extension.git
          cd business_extension
          git checkout "${{ steps.branch.outputs.branch_name }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven
          cache-dependency-path: business_core/**/pom.xml

      - name: Upload Maven workspace
        uses: actions/upload-artifact@v4
        with:
          name: maven-workspace
          path: |
            business_core/
            business_extension/
          if-no-files-found: error

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Download Maven workspace
        uses: actions/download-artifact@v4
        with:
          name: maven-workspace

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven
          cache-dependency-path: business_core/**/pom.xml

      - name: Build core
        run: |
          cd business_core
          mvn clean install

      - name: Package api-service
        run: |
          cd business_core/api_service
          mvn package

      - name: Upload api-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-service-build
          path: business_core/api_service/
          if-no-files-found: error

  docker:
    name: Docker build & Push
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download api-service artifact
        uses: actions/download-artifact@v4
        with:
          name: api-service-build
          path: api_service

      - name: Docker build & Push
        working-directory: api_service
        run: |
          echo "${{ github.token }}" | docker login "${{ env.GHCR_REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin

          docker run --rm --privileged tonistiigi/binfmt:latest --install all
          docker buildx rm business-builder 2>/dev/null || true
          docker buildx create --name business-builder --driver docker-container --use
          docker buildx inspect --bootstrap

          IMAGE="${{ env.GHCR_IMAGE_PREFIX }}/${{ env.DOCKER_REPO_NAME }}_${{ github.event.inputs.env }}:${{ env.IMAGE_TAG }}"
          echo "Pushing ${IMAGE}"
          docker buildx build \
            -t "${IMAGE}" \
            --platform=linux/amd64 \
            --no-cache \
            --push \
            .

  deploy:
    name: Deploy
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ github.event.inputs.env == 'prod' && secrets.KUBE_CONFIG_PROD || secrets.KUBE_CONFIG_QA }}
          KUBE_SECRET_NAME: ${{ github.event.inputs.env == 'prod' && 'KUBE_CONFIG_PROD' || 'KUBE_CONFIG_QA' }}
          NAMESPACE: business-${{ github.event.inputs.env }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_B64// }" ]; then
            echo "::error::Secret ${KUBE_SECRET_NAME} vuoto. Configuralo nel repo Runner (Settings → Secrets)."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if ! kubectl config current-context; then
            echo "::error::Kubeconfig non valido dopo decode. In ${KUBE_SECRET_NAME} incolla solo la riga base64 (senza commenti #)."
            exit 1
          fi
          if ! kubectl auth can-i patch deployments -n "$NAMESPACE" 2>&1; then
            echo "::error::Token rifiutato dal cluster. Rigenera ${KUBE_SECRET_NAME}:"
            echo "  kubectl apply -f Runner/scripts/github-actions-rbac.yaml"
            echo "  TOKEN=\$(kubectl create token github-actions-${NAMESPACE} -n ${NAMESPACE} --duration=8760h)"
            echo "  ./Runner/scripts/generate-kubeconfig-secret.sh ${NAMESPACE} \"\$TOKEN\" /path/to/admin.conf"
            exit 1
          fi

      - name: Deploy image
        env:
          IMAGE: ${{ env.GHCR_IMAGE_PREFIX }}/${{ env.DOCKER_REPO_NAME }}_${{ github.event.inputs.env }}:${{ env.IMAGE_TAG }}
          NAMESPACE: business-${{ github.event.inputs.env }}
        run: |
          echo "Deploying ${IMAGE} to ${NAMESPACE}"
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            business-api="${IMAGE}" \
            -n "${NAMESPACE}"
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n "${NAMESPACE}" \
            --timeout=300s
