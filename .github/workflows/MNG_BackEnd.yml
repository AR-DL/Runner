name: MNG_BackEnd - Micros - K8s
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Which env?
        options:
          - qa
          - prod

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/ar-dl
  DOCKER_REPO_NAME: mng_api
  DEPLOYMENT_NAME: mng-api

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.env }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set branch for env
        id: branch
        run: |
          if [ "${{ github.event.inputs.env }}" = "prod" ]; then
            echo "branch_name=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=qa" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone Management Core
        working-directory: source
        run: |
          cd ..
          git clone git@github.com:AR-DL/management_core.git
          cd management_core
          git checkout "${{ needs.setup.outputs.branch_name }}"

      - name: Clone Management Extension
        working-directory: source
        run: |
          cd ..
          git clone git@github.com:AR-DL/management_extension.git
          cd management_extension
          git checkout "${{ needs.setup.outputs.branch_name }}"

      - name: Build core
        working-directory: source
        run: |
          cd ../management_core
          mvn clean install

      - name: Package api-service
        working-directory: source
        run: |
          cd ../management_core/api_service
          mvn package

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build && Push
        working-directory: source
        run: |
          cd ../management_core/api_service
          docker buildx build \
            -t "${{ env.GHCR_IMAGE_PREFIX }}/${{ env.DOCKER_REPO_NAME }}_${{ github.event.inputs.env }}:latest" \
            --platform=linux/arm64 \
            --no-cache \
            --push \
            .

  deploy:
    name: Deploy
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone Management Core
        working-directory: source
        run: |
          cd ..
          git clone git@github.com:AR-DL/management_core.git
          cd management_core
          git checkout "${{ needs.setup.outputs.branch_name }}"

      - name: Deploy to kubernetes
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ github.event.inputs.env == 'prod' && secrets.KUBE_CONFIG_PROD || secrets.KUBE_CONFIG_QA }}
        with:
          args: apply -f ./management_core/api_service/kubernetes/${{ github.event.inputs.env }}.yaml

      - name: Restart deployment
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ github.event.inputs.env == 'prod' && secrets.KUBE_CONFIG_PROD || secrets.KUBE_CONFIG_QA }}
        with:
          args: rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n mng-${{ github.event.inputs.env }}
