name: BusinessCRM_FrontEnd - Flutter
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Which env?
        options:
          - qa
          - prod

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/ar-dl
  DOCKER_REPO_NAME: business_front
  DEPLOYMENT_NAME: business-front
  IMAGE_TAG: ${{ github.run_number }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.env }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      port: ${{ steps.env.outputs.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set branch and port for env
        id: branch
        run: |
          if [ "${{ github.event.inputs.env }}" = "prod" ]; then
            echo "branch_name=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=qa" >> "$GITHUB_OUTPUT"
          fi

      - name: Set port for env
        id: env
        run: |
          if [ "${{ github.event.inputs.env }}" = "prod" ]; then
            echo "port=3049" >> "$GITHUB_OUTPUT"
          else
            echo "port=2999" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone Management App
        working-directory: source
        run: |
          cd ..
          git clone git@github.com:AR-DL/ManagementApp.git
          cd ManagementApp
          git checkout "${{ steps.branch.outputs.branch_name }}"

      - name: Create files from secrets - QA
        if: github.event.inputs.env == 'qa'
        run: |
          cd ManagementApp
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_ANDROID_SECRET_QA }}" > ./android/app/google-services.json
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_IOS_SECRET_QA }}" > ./ios/Runner/GoogleService-Info.plist
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_MACOS_SECRET_QA }}" > ./macos/Runner/GoogleService-Info.plist
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_WEB_SECRET_QA }}" > ./web/firebase-messaging-sw.js
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_FIREBASE_OPTIONS_SECRET_QA }}" > ./lib/firebase_options.dart

      - name: Create files from secrets - PROD
        if: github.event.inputs.env == 'prod'
        run: |
          cd ManagementApp
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_ANDROID_SECRET_PROD }}" > ./android/app/google-services.json
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_IOS_SECRET_PROD }}" > ./ios/Runner/GoogleService-Info.plist
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_MACOS_SECRET_PROD }}" > ./macos/Runner/GoogleService-Info.plist
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_WEB_SECRET_PROD }}" > ./web/firebase-messaging-sw.js
          echo "${{ secrets.MANAGEMENT_APP_GOOGLE_SERVICE_FIREBASE_OPTIONS_SECRET_PROD }}" > ./lib/firebase_options.dart

      - name: Configure build files
        run: |
          cd ManagementApp
          sed -i "s/{PORT}/${{ steps.env.outputs.port }}/g" server/server.sh
          sed -i "s/{env}/${{ github.event.inputs.env }}/g" Dockerfile

      - name: Upload frontend workspace
        uses: actions/upload-artifact@v4
        with:
          name: frontend-workspace
          path: ManagementApp/
          if-no-files-found: error

  docker:
    name: Docker build & Push
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend workspace
        uses: actions/download-artifact@v4
        with:
          name: frontend-workspace
          path: ManagementApp

      - name: Docker build & Push
        working-directory: ManagementApp
        run: |
          echo "${{ github.token }}" | docker login "${{ env.GHCR_REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin

          docker run --rm --privileged tonistiigi/binfmt:latest --install all
          docker buildx rm business-front-builder 2>/dev/null || true
          docker buildx create --name business-front-builder --driver docker-container --use
          docker buildx inspect --bootstrap

          IMAGE="${{ env.GHCR_IMAGE_PREFIX }}/${{ env.DOCKER_REPO_NAME }}_${{ github.event.inputs.env }}:${{ env.IMAGE_TAG }}"
          echo "Pushing ${IMAGE}"
          docker buildx build \
            -t "${IMAGE}" \
            --platform=linux/amd64 \
            --no-cache \
            --push \
            .

  deploy:
    name: Deploy
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ github.event.inputs.env == 'prod' && secrets.KUBE_CONFIG_PROD || secrets.KUBE_CONFIG_QA }}
          KUBE_SECRET_NAME: ${{ github.event.inputs.env == 'prod' && 'KUBE_CONFIG_PROD' || 'KUBE_CONFIG_QA' }}
          NAMESPACE: business-${{ github.event.inputs.env }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_B64// }" ]; then
            echo "::error::Secret ${KUBE_SECRET_NAME} vuoto. Configuralo nel repo Runner (Settings → Secrets)."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if ! kubectl config current-context; then
            echo "::error::Kubeconfig non valido dopo decode. In ${KUBE_SECRET_NAME} incolla solo la riga base64 (senza commenti #)."
            exit 1
          fi
          if ! kubectl auth can-i patch deployments -n "$NAMESPACE" 2>&1; then
            echo "::error::Token rifiutato dal cluster. Rigenera ${KUBE_SECRET_NAME}:"
            echo "  kubectl apply -f Runner/scripts/github-actions-rbac.yaml"
            echo "  TOKEN=\$(kubectl create token github-actions-${NAMESPACE} -n ${NAMESPACE} --duration=8760h)"
            echo "  ./Runner/scripts/generate-kubeconfig-secret.sh ${NAMESPACE} \"\$TOKEN\" /path/to/admin.conf"
            exit 1
          fi

      - name: Deploy image
        env:
          IMAGE: ${{ env.GHCR_IMAGE_PREFIX }}/${{ env.DOCKER_REPO_NAME }}_${{ github.event.inputs.env }}:${{ env.IMAGE_TAG }}
          NAMESPACE: business-${{ github.event.inputs.env }}
        run: |
          echo "Deploying ${IMAGE} to ${NAMESPACE}"
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            business-front="${IMAGE}" \
            -n "${NAMESPACE}"
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n "${NAMESPACE}" \
            --timeout=300s
